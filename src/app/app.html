<div
  class="flex flex-col h-screen w-screen overflow-hidden select-none"
  style="background-color: var(--dt-bg); color: var(--dt-text)"
>
  <!-- DevTools Top Header Bar -->
  <header
    class="h-9 px-3 border-b flex items-center justify-between shrink-0 select-none z-20"
    style="background-color: var(--dt-toolbar-bg); border-color: var(--dt-border)"
  >
    <!-- Left: Brand / Logo -->
    <div class="flex items-center gap-2">
      <div class="flex items-center gap-1 font-bold text-xs tracking-tight">
        <div
          class="w-5 h-5 rounded flex items-center justify-center font-black text-[11px] shadow-sm text-white"
          style="background: linear-gradient(135deg, #1a73e8, #1557b0)"
        >
          <span>IDB</span>
        </div>
        <span class="font-bold text-amber-500 text-xs ml-[-2px]">+</span>
      </div>

      <span class="text-[11px] opacity-40 mx-1">|</span>

      <!-- Mode pill -->
      <div
        class="flex items-center gap-1.5 px-2 py-0.5 rounded text-[11px]"
        style="
          background-color: var(--dt-surface);
          color: var(--dt-text-secondary);
          border: 1px solid var(--dt-border-subtle);
        "
      >
        <span
          class="w-2 h-2 rounded-full inline-block"
          [style.background-color]="
            idb.isDevTools() ? 'var(--dt-accent-green)' : 'var(--dt-accent-amber)'
          "
        ></span>
        <span>{{ idb.isDevTools() ? 'Inspected Tab' : 'Standalone Sandbox' }}</span>
      </div>
    </div>

    <!-- Right: Header Controls -->
    <div class="flex items-center gap-1">
      <!-- Toggle Left Panel (Sidebar) -->
      <button
        type="button"
        class="dt-icon-btn"
        [class.active]="ui.isLeftPanelOpen()"
        [title]="ui.isLeftPanelOpen() ? 'Hide Database Sidebar' : 'Show Database Sidebar'"
        (click)="ui.toggleLeftPanel()"
      >
        <svg
          class="w-3.5 h-3.5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
      </button>

      <!-- Toggle Right Panel (Inspector) -->
      <button
        type="button"
        class="dt-icon-btn"
        [class.active]="ui.isRightPanelOpen()"
        [title]="ui.isRightPanelOpen() ? 'Hide Row Inspector' : 'Show Row Inspector'"
        (click)="ui.toggleRightPanel()"
      >
        <svg
          class="w-3.5 h-3.5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="15" y1="3" x2="15" y2="21"></line>
        </svg>
      </button>

      <div class="w-[1px] h-4 mx-1" style="background-color: var(--dt-border)"></div>

      <!-- Dark / Light Mode Toggle -->
      <button
        type="button"
        class="dt-icon-btn"
        [title]="theme.currentTheme() === 'dark' ? 'Switch to Light Theme' : 'Switch to Dark Theme'"
        (click)="theme.toggleTheme()"
      >
        @if (theme.currentTheme() === 'dark') {
          <!-- Sun Icon -->
          <svg
            class="w-4 h-4 text-amber-400"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        } @else {
          <!-- Moon Icon -->
          <svg
            class="w-4 h-4 text-slate-700"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        }
      </button>
    </div>
  </header>

  <!-- Global Error Alert if any -->
  @if (idb.error()) {
    <div
      class="px-4 py-2 border-b text-xs flex items-center justify-between gap-2 text-white bg-red-600/90 z-30"
    >
      <div class="flex items-center gap-2 truncate">
        <svg
          class="w-4 h-4 shrink-0"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span class="truncate">{{ idb.error() }}</span>
      </div>
      <button
        class="text-xs hover:opacity-80 shrink-0 font-bold px-1"
        (click)="idb.error.set(null)"
      >
        ✕
      </button>
    </div>
  }

  <!-- Main Three-Column Layout Container -->
  <main class="flex-1 flex overflow-hidden">
    <!-- Left Column: Database & Table Browser -->
    @if (ui.isLeftPanelOpen()) {
      <app-sidebar></app-sidebar>
    }

    <!-- Middle & Right Columns: Router Outlet -->
    <div class="flex-1 min-w-0 flex overflow-hidden">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
