name: Publish Chrome extension

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXTENSION_DIST: /home/runner/work/idb-plus/idb-plus/dist/idb-plus/browser
      EXTENSION_ZIP: /home/runner/work/idb-plus/idb-plus/dist/idb-plus-chrome-extension.zip
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          corepack enable
          npm ci

      - name: Build extension
        run: npm run build

      - name: Package extension
        run: |
          rm -f "$EXTENSION_ZIP"
          cd "$EXTENSION_DIST"
          zip -r "$EXTENSION_ZIP" .

      - name: Upload packaged extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-package
          path: ${{ env.EXTENSION_ZIP }}

      - name: Publish to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v7.0.0
        with:
          file-path: ${{ env.EXTENSION_ZIP }}
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          publisher-id: ${{ secrets.CHROME_EXTENSION_PUBLISHER_ID }}
          client-id: ${{ secrets.CHROME_EXTENSION_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_EXTENSION_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_EXTENSION_REFRESH_TOKEN }}
