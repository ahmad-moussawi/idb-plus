name: Publish Chrome extension

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: chrome-web-store
    permissions:
      contents: read
    env:
      EXTENSION_DIST: ${{ github.workspace }}/dist/idb-plus/browser
      EXTENSION_ZIP: ${{ github.workspace }}/dist/idb-plus-chrome-extension.zip
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          corepack enable
          npm ci

      - name: Build extension
        run: npm run build

      - name: Package extension
        run: |
          rm -f "$EXTENSION_ZIP"
          cd "$EXTENSION_DIST"
          zip -r "$EXTENSION_ZIP" .

      - name: Upload packaged extension artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chrome-extension-package
          path: ${{ env.EXTENSION_ZIP }}

      - name: Publish to Chrome Web Store
        uses: mnao305/chrome-extension-upload@f549d5d654694a7722d6abfa64c97409ad5e64c1 # v7.0.0
        with:
          file-path: ${{ env.EXTENSION_ZIP }}
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          publisher-id: ${{ secrets.CHROME_EXTENSION_PUBLISHER_ID }}
          client-id: ${{ secrets.CHROME_EXTENSION_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_EXTENSION_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_EXTENSION_REFRESH_TOKEN }}
